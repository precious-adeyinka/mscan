[package]
name = "mscan"
version = "0.1.0"
edition = "2024"
description = "A small concurrent TCP port scanner"
license = "MIT"
repository = "https://github.com/precious-adeyinka/mscan"
homepage = "https://github.com/precious-adeyinka/mscan"
documentation = "https://github.com/precious-adeyinka/mscan#readme"
readme = "README.md"
keywords = ["port-scanner", "networking", "security", "tcp", "cli"]
categories = ["command-line-utilities", "network-programming"]
authors = ["Precious Adeyinka <officialpreciousadeyinka@gmail.com>"]
exclude = ["baseline.txt", "test-dir/", "dist/", ".env", "*.json", "*.log", "target/"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
